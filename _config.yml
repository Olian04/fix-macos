title: fix-macos
description: Fixes I've found to make macOS less annoying.
url: https://olian04.github.io
baseurl: /fix-macos
lang: en

author:
  name: Oliver Anteros

# Styling comes from Pico CSS, loaded via CDN in _layouts/default.html. It is a
# classless framework that auto-adapts to the visitor's prefers-color-scheme.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# index.md is the site's home page; keep the repo README out of the built site.
readme_index:
  enabled: false
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - script
  - vendor
  - .gems
  - Makefile
