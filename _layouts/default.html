<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Pico CSS: classless, auto light/dark via prefers-color-scheme. -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
    <style>
      /* Mimics how editors mark a non-breaking space: a hollow yellow box. */
      .nbsp-box {
        display: inline-block;
        width: 0.55em;
        height: 1.05em;
        margin: 0 0.15em 0 0;
        vertical-align: -0.15em;
        background-color: #e8c50025;
        border: 1.5px solid #e8c500b9;
        border-radius: 1px;
        box-sizing: border-box;
      }
    </style>
    {%- seo -%}
  </head>
  <body>
    <main class="container">
      <h1>{{ site.title }}</h1>
      {{ content }}
    </main>
  </body>
</html>
