- category: Fixing missing behavior
  description: Adding new behavior or changing built in behavior that is either missing from the OS or behaves very differently compared to Linux or Windows.
  items:
    - emoji: '⌨️'
      name: Karabiner-Elements
      link: https://github.com/pqrs-org/Karabiner-Elements
      link_text: pqrs-org/Karabiner-Elements
      repo: pqrs-org/Karabiner-Elements
      desc: "Remaps keys so a Windows/Linux keyboard works right on Mac — without it, keys land in the wrong place or don't work at all."
    - emoji: '🖱️'
      name: Smooze
      link: https://smooze.co
      link_text: smooze.co
      desc: 'Disables scroll acceleration and jerky scroll animations that make Mac scrolling feel alien coming from Windows/Linux. (Proprietary; free tier is enough.)'
    - emoji: '🔌'
      name: Ethernet Status
      link: https://ethernetstatus.com
      link_text: ethernetstatus.com
      desc: 'Adds the wired-connection menu bar indicator Mac lacks, since it assumes everyone is on Wi-Fi. (Proprietary; free tier is enough.)'
    - emoji: '🍺'
      name: Homebrew
      link: https://github.com/Homebrew/brew
      link_text: Homebrew/brew
      repo: Homebrew/brew
      desc: 'The package manager Mac is missing — install and update CLI tools the way you would with `apt` or `pacman`.'
    - emoji: '🪟'
      name: Rectangle
      link: https://github.com/rxhanson/Rectangle
      link_text: rxhanson/Rectangle
      repo: rxhanson/Rectangle
      desc: 'Keyboard-driven window snapping and tiling that Windows/Linux ship by default.'

- category: Improving built in behavior
  description: Improving built in behavior either making it easier to use or more powerful.
  items:
    - emoji: '🔀'
      name: AltTab
      link: https://github.com/lwouis/alt-tab-macos
      link_text: lwouis/alt-tab-macos
      repo: lwouis/alt-tab-macos
      desc: "Turns Mac's near-useless alt-tab into a proper Windows-style window switcher with thumbnails."
    - emoji: '🔓'
      name: Gatekeeper bypass guide
      link: https://macpaw.com/how-to/fix-macos-cannot-verify-that-app-is-free-from-malware
      link_text: macpaw.com
      desc: 'How to run unsigned apps and stop Mac from blocking software you trust. (Guide, not an app.)'
    - emoji: '💻'
      name: iTerm2
      link: https://github.com/gnachman/iTerm2
      link_text: gnachman/iTerm2
      repo: gnachman/iTerm2
      desc: 'A far more capable Terminal.app replacement; I use its hotkey pop-over so my terminal follows me to whichever screen is active.'
    - emoji: '<span class="nbsp-box" title="non-breaking space"></span>'
      name: Disable non-breaking space keybind
      link: https://gist.github.com/Olian04/00889798d34d5e89d5c93f822a97eff7
      link_text: gist.github.com/Olian04/00889..7eff7
      gist: 00889798d34d5e89d5c93f822a97eff7
      desc: 'Pressing Option+Space inserts a special kind of space character that often breaks command line applications and shells. This one liner fixes that.'
    - emoji: '📊'
      name: Baobab
      link: https://formulae.brew.sh/formula/baobab
      link_text: https://formulae.brew.sh/formula/baobab
      desc: 'The disk usage utility from GNOME Linux. Compared to the Mac built in, this one is actually usefull.'

